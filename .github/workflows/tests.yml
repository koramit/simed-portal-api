name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        include:
          - laravel: '12'
            framework: '^12.71'
            testbench: '^10.0'
          - laravel: '13'
            framework: '^13.0'
            testbench: '^11.3'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # composer.lock is not committed; constrain the matrix versions for this run only.
      - name: Install dependencies
        run: >
          composer update --prefer-dist --no-interaction --no-progress
          --with "laravel/framework:${{ matrix.framework }}"
          --with "orchestra/testbench:${{ matrix.testbench }}"

      - name: Run tests
        run: vendor/bin/pest

  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test
